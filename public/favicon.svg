<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" fill="#0B1325"/>

  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3654C5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Central node -->
  <circle cx="24" cy="24" r="6" fill="url(#faviconGrad)"/>

  <!-- Four surrounding nodes -->
  <circle cx="12" cy="12" r="3.5" fill="#4169E1" opacity="0.9"/>
  <circle cx="36" cy="12" r="3.5" fill="#D4AF37" opacity="0.8"/>
  <circle cx="12" cy="36" r="3.5" fill="#D4AF37" opacity="0.8"/>
  <circle cx="36" cy="36" r="3.5" fill="#4169E1" opacity="0.9"/>

  <!-- Connecting edges -->
  <line x1="24" y1="24" x2="12" y2="12" stroke="#4169E1" stroke-width="1.5" opacity="0.7"/>
  <line x1="24" y1="24" x2="36" y2="12" stroke="#D4AF37" stroke-width="1.5" opacity="0.7"/>
  <line x1="24" y1="24" x2="12" y2="36" stroke="#D4AF37" stroke-width="1.5" opacity="0.7"/>
  <line x1="24" y1="24" x2="36" y2="36" stroke="#4169E1" stroke-width="1.5" opacity="0.7"/>
