<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stopColor:#8C7B63;stop-opacity:1" />
      <stop offset="100%" style="stopColor:#6B8C75;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  {/* Outer circle - representing completeness and connection */}
  <circle cx="24" cy="24" r="20" stroke="url(#logoGrad)" strokeWidth="1.5" opacity="0.8" filter="url(#softShadow)" />

  {/* Central node - representing the core system */}
  <circle cx="24" cy="24" r="5" fill="url(#logoGrad)" />

  {/* Surrounding nodes - representing distributed systems */}
  <circle cx="24" cy="8" r="3" fill="#6B8C75" opacity="0.7" />
  <circle cx="8" cy="24" r="3" fill="#8C7B63" opacity="0.7" />
  <circle cx="40" cy="24" r="3" fill="#8C7B63" opacity="0.7" />
  <circle cx="24" cy="40" r="3" fill="#6B8C75" opacity="0.7" />

  {/* Connecting edges - clean lines showing relationships */}
  <line x1="24" y1="24" x2="24" y2="8" stroke="url(#logoGrad)" strokeWidth="1.5" opacity="0.6" />
  <line x1="24" y1="24" x2="8" y2="24" stroke="url(#logoGrad)" strokeWidth="1.5" opacity="0.6" />
  <line x1="24" y1="24" x2="40" y2="24" stroke="url(#logoGrad)" strokeWidth="1.5" opacity="0.6" />
  <line x1="24" y1="24" x2="24" y2="40" stroke="url(#logoGrad)" strokeWidth="1.5" opacity="0.6" />
</svg>
